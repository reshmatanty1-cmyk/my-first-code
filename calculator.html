<!DOCTYPE html>
<html>
<head>
<title>Calculator by Reshma</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#0f0f23;margin:0;font-family:Arial}
.box{background:#1a1a3d;padding:25px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.5);width:280px}
#display{width:100%;height:60px;background:#0d1b6e;color:white;font-size:28px;text-align:right;padding:10px;box-sizing:border-box;border:none;border-radius:10px;margin-bottom:15px}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{height:55px;font-size:20px;border:none;border-radius:10px;background:#1430b0;color:white;cursor:pointer;font-weight:bold}
button:active{transform:scale(0.95)}
.clear{background:#ff8fa3;color:white}
.back{background:#ff6b81;color:white}
.equal{background:#ff8fc1;color:white;grid-column:span 2}
</style>
</head>
<body>
<div class="box">
<input type="text" id="display" readonly value="0">
<div class="buttons">
<button class="clear" onclick="clearAll()">C</button>
<button class="back" onclick="backspace()">⌫</button>
<button onclick="add('/')">/</button>
<button onclick="add('*')">*</button>

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button onclick="add('-')">-</button>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button onclick="add('+')">+</button>

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button onclick="add('.')">.</button>

<button onclick="add('0')">0</button>
<button onclick="add('00')">00</button>
<button class="equal" onclick="calculate()">=</button>
</div>
<p style="color:#8a9cff;text-align:center;margin-top:15px;font-size:14px">Made by Reshma - PGDCA</p>
</div>

<script>
let display = document.getElementById('display');
function add(val){
 if(display.value=='0' && val!='.' ) display.value='';
 display.value+=val;
}
function clearAll(){ display.value='0'; }
function backspace(){
 display.value = display.value.slice(0,-1);
 if(display.value=='' ) display.value='0';
}
function calculate(){
 try{ display.value=eval(display.value); }
 catch{ display.value='Error'; }
}
</script>
</body>
</html>
